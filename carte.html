/* ==========================================================================
   Carte de Visite Virtuelle - TECHNIM | Maachou CHERGUI
   Design System & Styling
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap');

:root {
  --bg-primary: #0a0e17;
  --bg-card: rgba(18, 24, 38, 0.75);
  --bg-card-hover: rgba(26, 35, 56, 0.85);
  --border-color: rgba(255, 255, 255, 0.08);
  --border-glow: rgba(0, 210, 255, 0.3);
  
  --primary: #00d2ff;
  --primary-gradient: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
  --accent-cyan: #00f2fe;
  --accent-blue: #4facfe;
  --accent-glow: rgba(0, 242, 254, 0.4);
  
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --text-dark: #0f172a;
  
  --success: #10b981;
  --success-bg: rgba(16, 185, 129, 0.15);
  
  --radius-xl: 24px;
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;
  
  --shadow-main: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 210, 255, 0.1);
  --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Light Theme Variables */
[data-theme="light"] {
  --bg-primary: #f0f4f8;
  --bg-card: rgba(255, 255, 255, 0.85);
  --bg-card-hover: rgba(255, 255, 255, 0.95);
  --border-color: rgba(0, 0, 0, 0.08);
  --border-glow: rgba(0, 114, 255, 0.3);
  --primary: #0066ff;
  --primary-gradient: linear-gradient(135deg, #0066ff 0%, #00d2ff 100%);
  --text-main: #0f172a;
  --text-muted: #64748b;
  --shadow-main: 0 20px 40px rgba(0, 102, 255, 0.08), 0 2px 10px rgba(0, 0, 0, 0.05);
}

/* Base Styles */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-font-smoothing: antialiased;
}

/* Scoped Resets against external CMS / WordPress theme overrides */
.card-wrapper, .card-wrapper * {
  box-sizing: border-box !important;
}

.card-wrapper {
  max-width: 480px !important;
  width: 100% !important;
  margin: 0 auto !important;
}

.quick-actions {
  display: grid !important;
  grid-template-columns: repeat(3, 1fr) !important;
  gap: 10px !important;
}

.action-btn.btn-main {
  grid-column: span 3 !important;
  display: flex !important;
  flex-direction: row !important;
}

.contact-details {
  display: flex !important;
  flex-direction: column !important;
  gap: 12px !important;
}

.info-item {
  display: flex !important;
  align-items: center !important;
}

.avatar img, .company-tag img {
  max-width: none !important;
}

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background-color: var(--bg-primary);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px 15px;
  position: relative;
  overflow-x: hidden;
}

/* Background Animated Gradient Mesh */
.bg-glow-1, .bg-glow-2 {
  position: fixed;
  border-radius: 50%;
  filter: blur(120px);
  z-index: 0;
  pointer-events: none;
  opacity: 0.5;
}

.bg-glow-1 {
  width: 450px;
  height: 450px;
  background: radial-gradient(circle, rgba(0,210,255,0.3) 0%, rgba(0,0,0,0) 70%);
  top: -100px;
  right: -100px;
  animation: float 12s infinite alternate ease-in-out;
}

.bg-glow-2 {
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(58,123,213,0.3) 0%, rgba(0,0,0,0) 70%);
  bottom: -150px;
  left: -150px;
  animation: float 15s infinite alternate-reverse ease-in-out;
}

@keyframes float {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(40px, 30px) scale(1.1); }
  100% { transform: translate(-30px, 50px) scale(0.95); }
}

/* Theme Toggle Button */
.theme-toggle {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 100;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  backdrop-filter: blur(12px);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-main);
  transition: var(--transition);
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.theme-toggle:hover {
  transform: scale(1.1) rotate(15deg);
  border-color: var(--primary);
}

/* Main Container */
.card-wrapper {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
}

.card {
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-main);
  overflow: hidden;
  transition: var(--transition);
}

.card:hover {
  border-color: var(--border-glow);
}

/* Header Banner */
.card-header {
  height: 140px;
  position: relative;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  overflow: hidden;
}

.card-header::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(10, 14, 23, 0.2) 0%, var(--bg-primary) 100%);
}

.company-tag {
  position: absolute;
  top: 15px;
  left: 20px;
  z-index: 2;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  padding: 6px 16px;
  border-radius: 30px;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
}

.company-tag img {
  height: 22px;
  width: auto;
  object-fit: contain;
}

/* Profile Section */
.profile-section {
  position: relative;
  padding: 0 24px 20px 24px;
  text-align: center;
  margin-top: -55px;
}

.avatar-wrapper {
  position: relative;
  display: inline-block;
  margin-bottom: 15px;
}

.avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 4px solid var(--bg-primary);
  background: #ffffff;
  box-shadow: 0 10px 25px rgba(0, 210, 255, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  margin: 0 auto;
  padding: 12px;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.avatar-initials {
  font-family: 'Outfit', sans-serif;
  font-size: 2.5rem;
  font-weight: 800;
  color: #ffffff;
  text-shadow: 0 2px 10px rgba(0,0,0,0.3);
}

.verified-badge {
  position: absolute;
  bottom: 6px;
  right: 6px;
  background: var(--accent-cyan);
  color: var(--text-dark);
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-primary);
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

.user-name {
  font-family: 'Outfit', sans-serif;
  font-size: 1.75rem;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: -0.5px;
  margin-bottom: 4px;
}

.user-title {
  font-size: 0.95rem;
  font-weight: 500;
  color: var(--primary);
  margin-bottom: 6px;
}

.user-company {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-muted);
  background: rgba(255, 255, 255, 0.05);
  padding: 4px 12px;
  border-radius: 20px;
  border: 1px solid var(--border-color);
}

/* Primary Action Buttons */
.quick-actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 0 24px 20px 24px;
}

.action-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 8px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  color: var(--text-main);
  text-decoration: none;
  font-size: 0.75rem;
  font-weight: 500;
  transition: var(--transition);
  cursor: pointer;
}

.action-btn svg {
  width: 22px;
  height: 22px;
  color: var(--primary);
  transition: var(--transition);
}

.action-btn:hover {
  background: rgba(0, 210, 255, 0.12);
  border-color: var(--primary);
  transform: translateY(-3px);
}

.action-btn:hover svg {
  transform: scale(1.15);
}

.action-btn.btn-main {
  grid-column: span 3;
  flex-direction: row;
  padding: 14px 20px;
  background: var(--primary-gradient);
  border: none;
  color: #ffffff;
  font-size: 0.95rem;
  font-weight: 600;
  border-radius: var(--radius-md);
  box-shadow: 0 8px 20px rgba(0, 210, 255, 0.3);
  margin-bottom: 5px;
}

.action-btn.btn-main svg {
  color: #ffffff;
}

.action-btn.btn-main:hover {
  box-shadow: 0 12px 28px rgba(0, 210, 255, 0.5);
  transform: translateY(-2px);
}

/* Contact List & Info Cards */
.contact-details {
  padding: 0 24px 24px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.info-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  transition: var(--transition);
  position: relative;
}

.info-item:hover {
  background: var(--bg-card-hover);
  border-color: rgba(0, 210, 255, 0.25);
  transform: translateX(3px);
}

.info-icon {
  width: 42px;
  height: 42px;
  border-radius: var(--radius-sm);
  background: rgba(0, 210, 255, 0.1);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.info-icon svg {
  width: 20px;
  height: 20px;
}

.info-content {
  flex-grow: 1;
  min-width: 0;
}

.info-label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
  margin-bottom: 2px;
  font-weight: 600;
}

.info-value {
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-decoration: none;
  display: block;
}

.info-value:hover {
  color: var(--primary);
}

.info-actions {
  display: flex;
  gap: 6px;
}

.icon-btn {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border-color);
  width: 34px;
  height: 34px;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: var(--transition);
  text-decoration: none;
}

.icon-btn:hover {
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
}

.icon-btn svg {
  width: 16px;
  height: 16px;
}

/* Footer & SIRET Bar */
.card-footer {
  padding: 16px 24px;
  background: rgba(0, 0, 0, 0.2);
  border-top: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.siret-badge {
  font-family: monospace;
  font-size: 0.82rem;
  background: rgba(255, 255, 255, 0.05);
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid var(--border-color);
  color: var(--text-main);
}

/* Modal Popup */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(8px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  visibility: hidden;
  transition: var(--transition);
}

.modal-overlay.active {
  opacity: 1;
  visibility: visible;
}

.modal-box {
  background: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 28px;
  width: 100%;
  max-width: 360px;
  text-align: center;
  box-shadow: 0 25px 50px rgba(0,0,0,0.6);
  transform: scale(0.9);
  transition: var(--transition);
}

.modal-overlay.active .modal-box {
  transform: scale(1);
}

.modal-title {
  font-family: 'Outfit', sans-serif;
  font-size: 1.25rem;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text-main);
}

.modal-subtitle {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-bottom: 20px;
}

.qr-code-container {
  background: #ffffff;
  padding: 16px;
  border-radius: var(--radius-md);
  display: inline-block;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  margin-bottom: 20px;
}

.qr-code-container canvas, .qr-code-container svg {
  display: block;
  max-width: 100%;
  height: auto;
}

.btn-close-modal {
  width: 100%;
  padding: 12px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  color: var(--text-main);
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}

.btn-close-modal:hover {
  background: rgba(255, 255, 255, 0.15);
}

/* Toast Notification */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--success);
  color: #ffffff;
  padding: 12px 24px;
  border-radius: 30px;
  font-weight: 600;
  font-size: 0.9rem;
  box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
  z-index: 2000;
  opacity: 0;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display: flex;
  align-items: center;
  gap: 8px;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* Print Styles */
@media print {
  body {
    background: #ffffff !important;
    color: #000000 !important;
    padding: 0;
  }

  .bg-glow-1, .bg-glow-2, .theme-toggle, .quick-actions, .modal-overlay, .icon-btn {
    display: none !important;
  }

  .card-wrapper {
    max-width: 100%;
    box-shadow: none !important;
  }

  .card {
    border: 1px solid #ccc !important;
    background: #ffffff !important;
    color: #000000 !important;
  }

  .user-name, .info-value, .modal-title {
    color: #000000 !important;
  }
}

  <!-- Scripts Int&eacute;gr&eacute;s -->
  <script>
/**
 * Carte de Visite Virtuelle - TECHNIM
 * Maachou CHERGUI - Gérant
 */

document.addEventListener('DOMContentLoaded', () => {
  // Contact details constant
  const CONTACT_INFO = {
    firstName: "Maachou",
    lastName: "CHERGUI",
    fullName: "Maachou CHERGUI",
    title: "Gérant de société",
    company: "TECHNIM",
    phone: "0775783955",
    phoneFormatted: "07 75 78 39 55",
    phoneInt: "+33775783955",
    email: "contact@technimreseaux.fr",
    website: "technim-reseaux.fr",
    websiteUrl: "https://technim-reseaux.fr",
    address: "27 Avenue Jean-Baptiste Clément",
    zipCode: "77290",
    city: "Mitry-Mory",
    fullAddress: "27 Avenue Jean-Baptiste Clément, 77290 Mitry-Mory",
    siret: "93238494400017",
    linkedin: "https://fr.linkedin.com/in/maachou-chergui"
  };

  // Theme Management
  const themeToggleBtn = document.getElementById('themeToggle');
  const currentTheme = localStorage.getItem('technim_theme') || 'dark';
  
  if (currentTheme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
  }

  if (themeToggleBtn) {
    themeToggleBtn.addEventListener('click', () => {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if (isLight) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('technim_theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('technim_theme', 'light');
      }
    });
  }

  // Toast Notification System
  window.showToast = function(message) {
    let toast = document.getElementById('toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'toast';
      toast.className = 'toast';
      document.body.appendChild(toast);
    }
    
    toast.innerHTML = `
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <span>${message}</span>
    `;
    
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
    }, 2500);
  };

  // Copy to Clipboard Helper
  window.copyToClipboard = function(text, label) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`${label} copié !`);
      }).catch(() => {
        fallbackCopyTextToClipboard(text, label);
      });
    } else {
      fallbackCopyTextToClipboard(text, label);
    }
  };

  function fallbackCopyTextToClipboard(text, label) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand('copy');
      showToast(`${label} copié !`);
    } catch (err) {
      showToast("Impossible de copier");
    }
    document.body.removeChild(textArea);
  }

  // Generate and Download vCard (.vcf)
  window.downloadVCard = function() {
    const vCardData = `BEGIN:VCARD
VERSION:3.0
N:${CONTACT_INFO.lastName};${CONTACT_INFO.firstName};;;
FN:${CONTACT_INFO.fullName}
ORG:${CONTACT_INFO.company}
TITLE:${CONTACT_INFO.title}
TEL;TYPE=CELL,VOICE;VALUE=uri:tel:${CONTACT_INFO.phoneInt}
EMAIL;TYPE=PREF,INTERNET;VALUE=text:${CONTACT_INFO.email}
URL;TYPE=WORK:${CONTACT_INFO.websiteUrl}
ADR;TYPE=WORK:;;${CONTACT_INFO.address};${CONTACT_INFO.city};;${CONTACT_INFO.zipCode};France
LABEL;TYPE=WORK:${CONTACT_INFO.address}\\n${CONTACT_INFO.zipCode} ${CONTACT_INFO.city}
X-SOCIALPROFILE;TYPE=linkedin:${CONTACT_INFO.linkedin}
NOTE:SIRET: ${CONTACT_INFO.siret} | TECHNIM
END:VCARD`.replace(/\n/g, '\r\n');

    const blob = new Blob([vCardData], { type: 'text/vcard;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.setAttribute('download', `${CONTACT_INFO.firstName}_${CONTACT_INFO.lastName}_TECHNIM.vcf`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    
    showToast("vCard téléchargée !");
  };

  // Native Web Share API
  window.shareCard = function() {
    if (navigator.share) {
      navigator.share({
        title: `${CONTACT_INFO.fullName} - ${CONTACT_INFO.company}`,
        text: `Carte de visite virtuelle de ${CONTACT_INFO.fullName}, ${CONTACT_INFO.title} chez ${CONTACT_INFO.company}`,
        url: window.location.href
      }).catch(() => {});
    } else {
      copyToClipboard(window.location.href, "Lien de la carte");
    }
  };
});

  </script>
